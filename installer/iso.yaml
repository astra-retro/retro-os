label: RetroOS-Live
grub2:
  default: 0
  timeout: 5
  entries:
    - name: "Start RetroOS Live (GNOME / Installer)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=RetroOS-Live rd.live.image enforcing=0 rd.vconsole.keymap=fr locale.LANG=fr_FR.UTF-8 inst.lang=fr_FR.UTF-8 inst.keymap=fr inst.geoloc=0"
      initrd: "/images/pxeboot/initrd.img"

    - name: "Start RetroOS Live (Debug)"
      linux: "/images/pxeboot/vmlinuz root=live:CDLABEL=RetroOS-Live rd.live.image enforcing=0 rd.vconsole.keymap=fr locale.LANG=fr_FR.UTF-8 inst.lang=fr_FR.UTF-8 inst.keymap=fr inst.geoloc=0 plymouth.enable=0 systemd.show_status=1 loglevel=7"
      initrd: "/images/pxeboot/initrd.img"
