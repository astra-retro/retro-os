name: Build RetroOS QCOW2

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Existing RetroOS image tag on GHCR"
        required: true
        default: latest
        type: string
  workflow_call:
    inputs:
      image_ref:
        description: "Immutable GHCR OCI digest for the PR"
        required: true
        type: string
      source_sha:
        description: "Exact PR commit for build scripts"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: retro-os-qcow2-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  qcow2:
    name: Build QCOW2 (amd64)
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 150

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure authentication for rootful Podman
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0700 /root/.docker
          sudo install -m 0600 "$HOME/.docker/config.json" /root/.docker/config.json

      - name: Resolve image to immutable digest
        id: image
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image_ref || '' }}
          IMAGE_TAG: ${{ inputs['image-tag'] || 'latest' }}
        run: |
          set -euo pipefail
          if [[ -n "$IMAGE_REF" ]]; then
            case "$IMAGE_REF" in
              "ghcr.io/${GITHUB_REPOSITORY,,}"@sha256:*) ;;
              *) echo "::error::Unexpected OCI image reference"; exit 1 ;;
            esac
            digest="$IMAGE_REF"
          else
            image="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
            sudo podman pull "$image"
            digest="$(sudo podman image inspect "$image" --format '{{index .RepoDigests 0}}')"
          fi
          if [[ -z "$digest" || "$digest" != *@sha256:* ]]; then
            echo "::error::Unable to resolve OCI digest" >&2
            exit 1
          fi
          sudo podman pull "$digest"
          echo "ref=$digest" >> "$GITHUB_OUTPUT"
          echo "Building QCOW2 from $digest"

      - name: Preflight osbuild mounts
        shell: bash
        run: bash .github/scripts/qcow2-mount-preflight.sh

      - name: Build QCOW2
        shell: bash
        env:
          BOOTC_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail

          mkdir -p output diagnostics

          # Run rootful with an unconfined AppArmor profile and no UID mapping.
          set +e
          sudo podman run --rm \
            --privileged \
            --userns=host \
            --security-opt apparmor=unconfined \
            --security-opt label=disable \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder-cli:latest \
            --bootc-ref "$BOOTC_REF" \
            --bootc-default-fs btrfs \
            build qcow2 2>&1 | tee diagnostics/qcow2-build.log
          status=${PIPESTATUS[0]}
          set -e
          sudo chown -R "$(id -u):$(id -g)" output
          exit "$status"

      - name: Mount diagnostics
        if: failure()
        shell: bash
        run: |
          echo '=== Mounted filesystems ==='
          findmnt -T /var/lib/containers/storage || true
          echo '=== AppArmor denials ==='
          sudo journalctl -k --no-pager -n 200 \
            | grep -Ei 'apparmor|DENIED|audit' || true
          echo '=== Podman info ==='
          sudo podman info --format '{{.Host.Security}}' || true

      - name: Upload QCOW2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retro-os-qcow2-diagnostics-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Create SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          find output -type f -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          test -s SHA256SUMS

      - name: Upload QCOW2 artifact
        uses: actions/upload-artifact@v7
        with:
          name: retro-os-qcow2-${{ github.run_number }}
          path: |
            output/
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
