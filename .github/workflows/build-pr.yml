name: Build PR ISO / QCOW2 (manual)

# No push, pull_request, schedule, or comment triggers.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open PR number targeting main (same repository)"
        required: true
        type: number
      format:
        description: "Images to build"
        required: true
        type: choice
        default: both
        options:
          - both
          - iso
          - qcow2

permissions:
  contents: read

concurrency:
  group: retro-os-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Authorize run and pin PR commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      tag: ${{ steps.pr.outputs.tag }}
    steps:
      - name: Verify initiator, branch and PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ALLOWED_BUILDERS: ${{ vars.ALLOWED_BUILDERS }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Launch this workflow from main only"
            exit 1
          }

          # GitHub itself limits workflow_dispatch to users with write access.
          # Optional JSON allowlist provides a stricter repository policy.
          if [[ -n "$ALLOWED_BUILDERS" ]] && ! jq -e \
            --arg actor "$GITHUB_ACTOR" \
            'type == "array" and index($actor) != null' \
            <<< "$ALLOWED_BUILDERS" > /dev/null; then
            echo "::error::Actor is not in ALLOWED_BUILDERS"
            exit 1
          fi

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Invalid PR number"; exit 1;
          }
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repo' \
            <<< "$pr" > /dev/null || {
            echo "::error::Only open same-repository PRs targeting main are supported"
            exit 1
          }
          sha="$(jq -r '.head.sha' <<< "$pr")"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=pr-${PR_NUMBER}-${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "Building PR #$PR_NUMBER at $sha" >> "$GITHUB_STEP_SUMMARY"

  build-oci:
    name: Build OCI from exact PR commit (unprivileged token)
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout PR SHA (no retained token)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build and rechunk image locally
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          just check
          just build retro-os "$IMAGE_TAG"
          just ostree-rechunk retro-os "$IMAGE_TAG"
          mkdir -p dist
          podman save --format oci-archive \
            --output dist/retro-os.oci.tar \
            "localhost/retro-os:$IMAGE_TAG"

      # Publish happens in a separate job: PR-controlled code never gets
      # a package-write token, GHCR credentials, or signing secrets.
      - name: Transfer OCI archive to publisher
        uses: actions/upload-artifact@v7
        with:
          name: retro-os-oci-${{ github.run_id }}
          path: dist/retro-os.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-oci:
    name: Publish temporary PR image
    needs: [prepare, build-oci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - name: Download OCI built without write credentials
        uses: actions/download-artifact@v8
        with:
          name: retro-os-oci-${{ github.run_id }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push PR-specific tag and return immutable digest
        id: push
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          podman load -i retro-os.oci.tar
          target="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
          podman tag "localhost/retro-os:${IMAGE_TAG}" "$target"
          podman push --digestfile image.digest "$target"
          digest="$(cat image.digest)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::Invalid pushed OCI digest"
            exit 1
          }
          ref="ghcr.io/${GITHUB_REPOSITORY,,}@${digest}"
          echo "image_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "OCI payload: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

  iso:
    name: Build ISO
    if: inputs.format == 'both' || inputs.format == 'iso'
    needs: [prepare, publish-oci]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-live-iso.yml
    with:
      image_ref: ${{ needs.publish-oci.outputs.image_ref }}
      source_sha: ${{ needs.prepare.outputs.sha }}

  qcow2:
    name: Build QCOW2
    if: inputs.format == 'both' || inputs.format == 'qcow2'
    needs: [prepare, publish-oci]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-disk.yml
    with:
      image_ref: ${{ needs.publish-oci.outputs.image_ref }}
      source_sha: ${{ needs.prepare.outputs.sha }}
