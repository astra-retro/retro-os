name: Cleanup GHCR (Astra Retro OS)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler sans supprimer"
        type: boolean
        required: true
        default: true
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean ghcr.io/${{ github.repository }}
    runs-on: ubuntu-24.04
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Prune unprotected GHCR images
        uses: jenskeiner/ghcr-container-repository-cleanup-action@1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          repository: ${{ github.event.repository.name }}
          package: retro-os
          exclude-tags: '^(latest|v[0-9]+\.[0-9]+\.[0-9]+)$'
          keep-n-tagged: 0
          keep-n-untagged: 0
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
