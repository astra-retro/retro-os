name: Cleanup GHCR (Astra Retro OS)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler sans supprimer"
        type: boolean
        required: true
        default: true
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean ghcr.io/${{ github.repository }}
    runs-on: ubuntu-24.04
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Cleanup GHCR
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: retro-os
          exclude-tags: '^(latest|v[0-9]+\.[0-9]+\.[0-9]+)$'
          use-regex: true
          keep-n-tagged: 0
          delete-untagged: true
          delete-orphaned-images: true
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
